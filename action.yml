
name: 'Godot Android Export'
description: 'Godot Engine 4.x Android export'
author: 'Simon Dalvai @dulvui'
branding:
  color: blue
  icon: upload-cloud

inputs:
  working-directory:
    description: 'The working directory'
    required: false
    default: '.'
  godot-version:
    description: 'Godot Engine version. Supported are 4.x versions'
    required: true
  godot-channel:
    description: 'Godot Engine release channel (stable, beta, rc1, rc2, rc3...). Defaults to stable'
    required: false
    default: 'stable'
  
  export-mode:
    description: 'Export mode: debug or release'
    required: false
    default: 'debug'
  

runs:
  using: "composite"
  steps:
    - name: Check is running on Linux
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "Error: This action only supports linux runners."
        exit 1

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Cache Godot Binary
      id: cache-godot
      uses: actions/cache@v6
      with:
        path: /usr/local/bin/godot
        key: ${{ runner.os }}-godot-bin-${{ inputs.godot-version }}-${{ inputs.godot-channel }}


    - name: Download and extract Godot Engine linux server
      shell: bash
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}-${{ inputs.godot-channel}}/Godot_v${{ inputs.godot-version }}-${{ inputs.godot-channel }}_linux.x86_64.zip"
        wget -q "${GODOT_URL}" -O godot.zip
        unzip -q godot.zip
        # mkdir -p ~/.config/godot/
        # touch ~/.config/godot/editor_settings-4.tres
        mv ./Godot_v${{ inputs.godot-version }}-${{ inputs.godot-channel }}_linux.x86_64 /usr/local/bin/godot
        rm godot.zip

    - name: Check if android custom build directory exists
      shell: bash
      id: check-custom-build
      run: |
        if [ -d "${{ inputs.working-directory }}/android" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Godot export templates
      id: cache-export-templates
      if: steps.check-custom-build.outputs.exists == 'false'
      uses: actions/cache@v6
      with:
        path: ~/.local/share/godot/export_templates/
        key: ${{ runner.os }}-godot-${{ inputs.godot-version }}-export-templates

    # - name: Download and extract templates
    #   shell: bash
    #   if: steps.check-custom-build.outputs.exists != 'true' && steps.cache-export-templates.outputs.cache-hit != 'true'
    #   run: |
    #     TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}-${{ inputs.godot-channel}}/Godot_v${{ inputs.godot-version }}-${{ inputs.godot-channel }}_export_templates.tpz"
    #     wget -q "${TEMPLATES_URL}" -O templates.tpz
    #     unzip -q templates.tpz
        
    #     TEMPLATE_DIR="~/.local/share/godot/export_templates/${{ inputs.godot-version }}.${{ inputs.godot-channel }}"
    #     mkdir -p "${TEMPLATE_DIR}"

    #     mv templates/* "${TEMPLATE_DIR}/"
    #     rm -rf templates templates.tpz

    - name: Download and extract templates
      shell: bash
      if: steps.check-custom-build.outputs.exists != 'true' && steps.cache-export-templates.outputs.cache-hit != 'true'
      run: |
        TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}-${{ inputs.godot-channel }}/Godot_v${{ inputs.godot-version }}-${{ inputs.godot-channel }}_export_templates.tpz"
        wget -q "${TEMPLATES_URL}" -O templates.tpz
        unzip -q templates.tpz
        
        # Ensure the correct path uses $HOME instead of ~ for reliable bash expansion
        TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ inputs.godot-version }}.${{ inputs.godot-channel }}"
        mkdir -p "${TEMPLATE_DIR}"

        # Godot templates zip extracts into a folder named 'templates'
        mv templates/* "${TEMPLATE_DIR}/"
        rm -rf templates templates.tpz


    - name: Configure Godot Editor settings
      shell: bash
      run: |
        mkdir -p ~/.config/godot/
        cat << EOF > ~/.config/godot/editor_settings-4.tres
        [gd_resource type="EditorSettings" format=3]

        [resource]
        export/android/android_sdk_path = "${ANDROID_HOME}"
        export/android/shutdown_adb_on_exit = true
        export/android/debug_keystore = "${{ github.action_path }}/debug.keystore"
        export/android/debug_keystore_user = "androiddebugkey"
        export/android/debug_keystore_pass = "android"
        EOF
      
    - name: Import Assets
      shell: bash
      run: godot --headless --path "${{ inputs.working-directory }}" --editor --quit

    - name: Export Android Binary
      shell: bash
      run: |
        if [ "${{ inputs.export-mode }}" == "debug" ]; then
          godot --headless --path "${{ inputs.working-directory }}" --export-debug Android
        else
          godot --headless --path "${{ inputs.working-directory }}" --export-release Android
        fi
    # - name: Set Android SDK path in Godot Editor settings
